<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio — Maison Le Paria</title>
<style>
  :root {
    --void: #0b0c0d; --panel: #141517; --line: rgba(233,229,222,.12);
    --ink: #e9e5de; --dim: #9d9890; --ash: #6b6862; --beige: #c9bda8;
    --ok: #7fb08a; --warn: #d2a05a; --bad: #c47a72;
    --ease: cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--void); color: var(--ink);
    font: 400 14px/1.55 'Be Vietnam Pro', -apple-system, system-ui, sans-serif;
    display: grid; grid-template-columns: 290px 1fr; min-height: 100vh;
  }
  h1, h2, h3 { margin: 0; font-weight: 400; }
  button, input, textarea { font: inherit; color: inherit; }
  .micro { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--ash); }

  /* ── Sidebar ── */
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 22px 18px; display: flex; flex-direction: column; gap: 18px; }
  .mark { font-size: 11px; letter-spacing: .24em; }
  .sets { display: flex; flex-direction: column; gap: 4px; }
  .set-btn {
    text-align: left; background: none; border: 0; padding: 11px 12px; border-radius: 7px;
    cursor: pointer; display: grid; gap: 3px; transition: background .2s;
  }
  .set-btn:hover { background: rgba(255,255,255,.04); }
  .set-btn[aria-current='true'] { background: rgba(255,255,255,.08); }
  .set-btn b { font-weight: 500; }
  .set-btn span { font-size: 11px; color: var(--ash); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); margin-left: 6px; vertical-align: middle; }
  .ghost {
    background: none; border: 1px dashed var(--line); border-radius: 7px; padding: 11px;
    cursor: pointer; color: var(--dim); transition: border-color .2s, color .2s;
  }
  .ghost:hover { border-color: var(--beige); color: var(--ink); }

  /* ── Main ── */
  main { padding: 26px 30px 60px; max-width: 1100px; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .head h2 { font-size: 26px; letter-spacing: -.01em; }
  .row { display: flex; gap: 9px; flex-wrap: wrap; }
  .btn {
    background: none; border: 1px solid var(--line); border-radius: 7px; padding: 9px 16px;
    cursor: pointer; transition: border-color .2s, background .2s; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--beige); background: rgba(255,255,255,.04); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn--go { border-color: var(--beige); color: var(--beige); }
  .btn--bad { border-color: rgba(196,122,114,.4); color: var(--bad); }

  .grid-form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 22px; }
  label { display: grid; gap: 5px; }
  input, textarea {
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    padding: 9px 11px; width: 100%; resize: vertical;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--beige); }
  .wide { grid-column: 1 / -1; }

  .drop {
    margin-top: 22px; border: 1px dashed var(--line); border-radius: 10px;
    padding: 34px; text-align: center; color: var(--dim); transition: border-color .2s, background .2s;
  }
  .drop[data-over='true'] { border-color: var(--beige); background: rgba(201,189,168,.06); }

  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 10px; margin-top: 20px; }
  .cell { position: relative; border-radius: 7px; overflow: hidden; background: var(--panel); }
  .cell img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
  .cell button {
    position: absolute; inset: auto 6px 6px auto; background: rgba(8,9,10,.82); border: 0;
    border-radius: 5px; padding: 5px 8px; font-size: 10px; letter-spacing: .1em;
    cursor: pointer; opacity: 0; transition: opacity .2s;
  }
  .cell:hover button { opacity: 1; }

  .note { margin-top: 14px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); color: var(--dim); font-size: 13px; }
  .note b { color: var(--ink); font-weight: 500; }
  .note--warn { border-color: rgba(210,160,90,.35); }

  /* ── Console ── */
  .console {
    position: fixed; inset: auto 0 0 290px; background: #0e0f10; border-top: 1px solid var(--line);
    max-height: 46vh; display: none; flex-direction: column;
  }
  .console[data-open='true'] { display: flex; }
  .console header { display: flex; justify-content: space-between; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--line); }
  .console pre {
    margin: 0; padding: 14px 16px; overflow: auto; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim); white-space: pre-wrap; word-break: break-word;
  }
  .state { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .state[data-kind='run'] { color: var(--warn); }
  .state[data-kind='ok'] { color: var(--ok); }
  .state[data-kind='bad'] { color: var(--bad); }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    .console { left: 0; }
    .grid-form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<aside>
  <div class="mark">MAISON LE PARIA — STUDIO</div>
  <div class="sets" id="sets"></div>
  <button class="ghost" id="newSet">+ Bộ ảnh mới</button>
  <button class="set-btn" id="soundTab" style="border:1px solid var(--line)">
    <b>Âm thanh</b><span id="soundHint">…</span>
  </button>
  <div style="margin-top:auto; display:grid; gap:8px">
    <button class="ghost" id="domainBtn" style="padding:9px; font-size:11px">Tên miền</button>
    <div class="micro" id="gitState">…</div>
  </div>
</aside>

<main id="main"></main>

<div class="console" id="console">
  <header>
    <span class="state" id="consoleState" data-kind="run">đang chạy</span>
    <button class="btn" id="closeConsole" style="padding:4px 12px">Đóng</button>
  </header>
  <pre id="log"></pre>
</div>

<script type="module">
const $ = (id) => document.getElementById(id)
let data = null
let current = null
let view = 'sets'      // 'sets' | 'sound'

/* Chạy trong app Mac hay trong trình duyệt? Trong app, việc chọn và kéo thả
   tệp do macOS lo, và ảnh được nhập theo đường dẫn thay vì truyền byte. */
const native = window.webkit?.messageHandlers?.studio ?? null
const ask = (what) => native.postMessage(what)

const api = async (path, opts) => {
  const res = await fetch(path, opts)
  const out = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(out.error || 'Có lỗi xảy ra')
  return out
}

async function refresh() {
  data = await api('/api/state')
  if (!current || !data.sets.some((s) => s.id === current)) current = data.sets[0]?.id ?? null
  drawSets()
  drawMain()
  drawGit()
}

function drawSets() {
  $('sets').innerHTML = data.sets.map((s) => `
    <button class="set-btn" aria-current="${s.id === current}" data-id="${s.id}">
      <b>${s.meta?.title ?? s.folder}</b>
      <span>${s.published} ảnh${s.pending ? `<i class="dot" title="${s.pending} tệp mới chưa cập nhật"></i>` : ''}</span>
    </button>`).join('')
  $('sets').querySelectorAll('.set-btn').forEach((b) =>
    b.onclick = () => { current = b.dataset.id; view = 'sets'; drawSets(); drawMain() })
  $('soundTab').setAttribute('aria-current', view === 'sound')
  const m = data.sound.music
  $('soundHint').textContent = m ? `nhạc ${m.clock}` : 'chưa có nhạc'
}

function drawGit() {
  const g = data.git
  $('gitState').innerHTML = !g.isRepo
    ? 'Chưa nối GitHub'
    : `${g.remote ? g.remote.replace(/^https:\/\/github\.com\//, '').replace(/\.git$/, '') : 'chưa có remote'}<br>nhánh ${g.branch ?? '—'} · ${g.dirty} thay đổi`
  $('domainBtn').textContent = data.domain ?? 'Chưa gán tên miền'
}

$('domainBtn').onclick = async () => {
  const domain = prompt('Tên miền cho website (để trống nếu dùng địa chỉ github.io):', data.domain ?? '')
  if (domain === null) return
  try {
    await api('/api/domain', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ domain }),
    })
    await refresh()
    alert(domain.trim()
      ? `Đã đặt tên miền.\n\nCòn một việc phải làm ở nhà cung cấp tên miền: trỏ bản ghi DNS về GitHub Pages. Xem mục "Tên miền" trong README.`
      : 'Đã gỡ tên miền. Site sẽ chạy ở địa chỉ github.io.')
  } catch (err) { alert(err.message) }
}

function drawMain() {
  if (view === 'sound') { drawSound(); return }
  const set = data.sets.find((s) => s.id === current)
  if (!set) { $('main').innerHTML = '<p>Chưa có bộ ảnh nào. Bấm “Bộ ảnh mới”.</p>'; return }
  const m = set.meta ?? {}

  $('main').innerHTML = `
    <div class="head">
      <div>
        <div class="micro">BỘ ẢNH · thư mục “${set.folder}”</div>
        <h2 style="margin-top:6px">${m.title ?? set.folder}</h2>
      </div>
      <div class="row">
        <button class="btn" id="rebuild">Cập nhật ảnh lên web</button>
        <button class="btn btn--go" id="deploy">Triển khai</button>
      </div>
    </div>

    ${set.pending ? `<div class="note note--warn"><b>${set.pending}</b> tệp mới chưa được đưa lên web. Bấm <b>Cập nhật ảnh lên web</b>.</div>` : ''}
    ${set.duplicates ? `<div class="note"><b>${set.duplicates}</b> tệp đã bị bỏ qua vì trùng với ảnh khác trong bộ.</div>` : ''}

    <div class="grid-form">
      <label class="wide"><span class="micro">Tên hiển thị</span><input id="f-title" value="${m.title ?? ''}"></label>
      <label class="wide"><span class="micro">Dòng phụ</span><input id="f-subtitle" value="${m.subtitle ?? ''}"></label>
      <label class="wide"><span class="micro">Mô tả</span><textarea id="f-description" rows="3">${m.description ?? ''}</textarea></label>
      <label><span class="micro">Năm</span><input id="f-year" value="${m.year ?? ''}"></label>
      <label><span class="micro">Địa điểm</span><input id="f-location" value="${m.location ?? ''}"></label>
      <div class="wide row"><button class="btn" id="saveMeta">Lưu thông tin</button></div>
    </div>

    <div class="drop" id="drop">
      Kéo ảnh vào cửa sổ, hoặc <button class="btn" id="pick" style="padding:6px 14px">chọn tệp</button>
      <input type="file" id="file" multiple accept="image/*" hidden>
      <div class="micro" style="margin-top:10px">JPG · PNG · TIFF — cứ để nguyên cỡ gốc</div>
    </div>

    <div class="photos">${set.photos.map((p) => `
      <figure class="cell" style="margin:0">
        <img src="${p.thumb}" alt="" loading="lazy">
        <button data-file="${p.source}">Bỏ</button>
      </figure>`).join('')}
    </div>
    ${set.photos.length === 0 ? '<p style="color:var(--ash);margin-top:16px">Chưa có ảnh nào được đưa lên web.</p>' : ''}
  `

  $('saveMeta').onclick = async () => {
    await api('/api/meta', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: set.id, meta: {
        title: $('f-title').value.trim(),
        subtitle: $('f-subtitle').value.trim(),
        description: $('f-description').value.trim(),
        year: $('f-year').value.trim(),
        location: $('f-location').value.trim(),
      } }),
    })
    await refresh()
  }

  $('pick').onclick = async () => {
    if (!native) { $('file').click(); return }
    const paths = await ask('pickFiles')
    if (paths?.length) importPaths(set.id, paths)
  }
  $('file').onchange = (e) => upload(set.id, [...e.target.files])

  const drop = $('drop')
  ;['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => {
    e.preventDefault(); drop.dataset.over = 'true'
  }))
  ;['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => {
    e.preventDefault(); drop.dataset.over = 'false'
  }))
  drop.addEventListener('drop', (e) => upload(set.id, [...e.dataTransfer.files]))

  $('main').querySelectorAll('.cell button').forEach((b) => b.onclick = async () => {
    if (!confirm(`Bỏ ảnh này khỏi bộ?\n\nTệp gốc được chuyển vào thư mục “.đã bỏ”, không bị xoá hẳn.`)) return
    await api('/api/delete-file', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: set.id, file: b.dataset.file }),
    })
    await refresh()
  })

  $('rebuild').onclick = () => run('/api/images', {}, 'Cập nhật ảnh')
  $('deploy').onclick = deploy
}

/** Nhập ảnh theo đường dẫn — chỉ dùng khi chạy trong app Mac. */
async function importPaths(setId, paths) {
  openConsole('Đang thêm ảnh')
  log(`${paths.length} tệp\n`)
  const out = await api('/api/import-paths', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id: setId, paths }),
  })
  out.added.forEach((f) => log(`  ✓ ${f}\n`))
  out.failed.forEach((f) => log(`  ✕ ${f}\n`))
  if (!out.added.length) { $('consoleState').dataset.kind = 'bad'; $('consoleState').textContent = 'Không thêm được ảnh nào'; return }
  log('\nĐang dựng các bản ảnh cho web…\n')
  await run('/api/images', {}, 'Cập nhật ảnh', true)
}

/* Ảnh kéo từ Finder vào cửa sổ app sẽ đi qua đây. */
window.__nativeImport = (paths) => {
  const audio = paths.filter((p) => /\.(m4a|mp3|wav|aiff?|aac|flac)$/i.test(p))
  const images = paths.filter((p) => /\.(jpe?g|png|tiff?|webp)$/i.test(p))
  // What a dropped file means depends on where you are: a track in the sound
  // section, photographs everywhere else.
  if (view === 'sound' && audio.length) { setMusic(audio[0]); return }
  if (current && images.length) importPaths(current, images)
}

function drawSound() {
  const c = data.sound.config
  const m = data.sound.music

  $('main').innerHTML = `
    <div class="head">
      <div>
        <div class="micro">ÂM THANH</div>
        <h2 style="margin-top:6px">Nhạc nền</h2>
      </div>
      <div class="row"><button class="btn btn--go" id="deploy">Triển khai</button></div>
    </div>

    <div class="note">Âm thanh chỉ bật khi người xem chạm vào trang — mọi trình duyệt đều
      chặn tiếng phát trước cử chỉ đầu tiên. Không có cách nào đi vòng.</div>

    <h3 class="micro" style="margin:30px 0 12px; color:var(--beige)">NHẠC NỀN</h3>
    ${m ? `
      <div class="note"><b>${c.music.file.split('/').pop()}</b> — ${m.clock}, ${m.kb} kb
        ${c.music.credit ? `<br>Nguồn: ${c.music.credit}` : ''}</div>
      <audio controls src="/audio/nhac.m4a?v=${Date.now()}" style="width:100%; margin-top:12px"></audio>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="pickMusic">Thay nhạc khác</button>
        <button class="btn btn--bad" id="musicOff">Gỡ nhạc</button>
      </div>
    ` : `
      <div class="drop" id="musicDrop">
        Chưa có nhạc nền — website chỉ có tiếng phòng.<br>
        <button class="btn" id="pickMusic" style="margin-top:12px; padding:6px 14px">Chọn tệp nhạc</button>
        <input type="file" id="musicFile" accept="audio/*" hidden>
        <div class="micro" style="margin-top:10px">WAV · MP3 · M4A · AIFF · FLAC</div>
      </div>
      <div class="note note--warn" style="margin-top:14px">Chỉ dùng nhạc bạn có quyền phát
        công khai. Website có tên miền là phát hành công khai, và một bài hát thương mại
        cần giấy phép kể cả khi bạn đã mua bản nhạc đó.</div>
    `}

    <div class="grid-form" style="margin-top:18px">
      <label><span class="micro">Âm lượng nhạc (0 – 1)</span>
        <input id="s-musicVol" type="number" step="0.01" min="0" max="1" value="${c.music.volume}"></label>
      <label><span class="micro">Âm lượng tiếng phòng (0 – 1)</span>
        <input id="s-ambVol" type="number" step="0.01" min="0" max="1" value="${c.ambience.volume}"></label>
      <label class="wide"><span class="micro">Ghi nguồn nhạc (nếu giấy phép yêu cầu)</span>
        <input id="s-credit" value="${c.music.credit ?? ''}"></label>
      <div class="wide row"><button class="btn" id="saveSound">Lưu cài đặt</button></div>
    </div>

  `
  $('pickMusic').onclick = async () => {
    if (!native) { $('musicFile')?.click(); return }
    const paths = await ask({ action: 'pick', kind: 'audio' })
    if (paths?.length) setMusic(paths[0])
  }
  if ($('musicFile')) $('musicFile').onchange = (e) => uploadMusic(e.target.files[0])
  if ($('musicOff')) $('musicOff').onclick = async () => {
    if (!confirm('Gỡ nhạc nền khỏi website?')) return
    await run('/api/music-off', {}, 'Gỡ nhạc')
  }

  $('saveSound').onclick = async () => {
    await api('/api/sound', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        music: { volume: Number($('s-musicVol').value), credit: $('s-credit').value.trim() },
        ambience: { volume: Number($('s-ambVol').value) },
      }),
    })
    await refresh()
  }

  $('deploy').onclick = deploy
}

const setMusic = (path) => run('/api/music', { path }, 'Thêm nhạc')

async function uploadMusic(file) {
  if (!file) return
  openConsole('Đang tải nhạc')
  const out = await api(`/api/music-upload?name=${encodeURIComponent(file.name)}`, { method: 'POST', body: file })
  await run('/api/music', { path: out.scratch }, 'Thêm nhạc', true)
}

async function upload(setId, files) {
  const images = files.filter((f) => /\.(jpe?g|png|tiff?|webp)$/i.test(f.name))
  if (!images.length) return
  openConsole('Đang tải ảnh')
  for (const [i, file] of images.entries()) {
    log(`${i + 1}/${images.length}  ${file.name}\n`)
    try {
      await api(`/api/upload?set=${encodeURIComponent(setId)}&name=${encodeURIComponent(file.name)}`,
        { method: 'POST', body: file })
    } catch (err) { log(`   ✕ ${err.message}\n`) }
  }
  log('\nĐã chép xong. Đang dựng các bản ảnh cho web…\n')
  await run('/api/images', {}, 'Cập nhật ảnh', true)
}

function deploy() {
  if (!data.git.isRepo || !data.git.remote) { connectGithub(); return }
  const note = prompt('Ghi chú cho lần triển khai này:', 'Cập nhật')
  if (note === null) return
  run('/api/deploy', { message: note }, 'Triển khai')
}

$('soundTab').onclick = () => { view = 'sound'; drawSets(); drawMain() }

$('newSet').onclick = async () => {
  const title = prompt('Tên bộ ảnh mới (cũng là tên thư mục):')
  if (!title?.trim()) return
  try {
    const made = await api('/api/set', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ title }),
    })
    current = made.id
    view = 'sets'
    await refresh()
    alert(`Đã tạo thư mục “${made.folder}”.\nGiờ kéo ảnh vào là xong.`)
  } catch (err) { alert(err.message) }
}

async function connectGithub() {
  const remote = prompt('Dán địa chỉ kho GitHub (ví dụ https://github.com/ten-ban/maison-le-paria.git):')
  if (!remote) return
  await run('/api/git-init', { remote }, 'Nối GitHub')
}

/* ── console ── */
function openConsole(title) {
  $('console').dataset.open = 'true'
  $('consoleState').dataset.kind = 'run'
  $('consoleState').textContent = `${title} — đang chạy`
  $('log').textContent = ''
}
const log = (text) => { $('log').textContent += text; $('log').scrollTop = $('log').scrollHeight }
$('closeConsole').onclick = () => { $('console').dataset.open = 'false' }

async function run(path, payload, title, keepOpen) {
  if (!keepOpen) openConsole(title)
  const res = await fetch(path, {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload),
  })
  const reader = res.body.getReader()
  const dec = new TextDecoder()
  let all = ''
  while (true) {
    const { done, value } = await reader.read()
    if (done) break
    const chunk = dec.decode(value, { stream: true })
    all += chunk
    log(chunk)
  }
  const failed = all.includes('__FAIL__')
  $('consoleState').dataset.kind = failed ? 'bad' : 'ok'
  $('consoleState').textContent = failed ? `${title} — thất bại` : `${title} — xong`
  $('log').textContent = $('log').textContent.replace(/__DONE__|__FAIL__/g, '')
  await refresh()
}

refresh()
</script>
</body>
</html>
